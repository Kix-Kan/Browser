name: Build signed browser release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact KixKan Browser version from VERSION.env
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64, kixkan-browser]
    timeout-minutes: 240
    environment: browser-release
    steps:
      - uses: actions/checkout@v4
      - name: Confirm requested version
        run: |
          source VERSION.env
          [[ "${KIXKAN_BROWSER_VERSION}" == "${{ inputs.version }}" ]]
      - name: Validate overlay
        run: bash scripts/validate.sh
      - name: Verify source and build engine/package
        run: |
          bash scripts/fetch-source.sh
          bash scripts/build-engine.sh
          bash scripts/build-deb.sh
      - name: Import protected Debian signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.DEB_SIGNING_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode | gpg --batch --import
      - name: Sign package and checksums
        env:
          KIXKAN_DEB_SIGNING_KEY: ${{ secrets.DEB_SIGNING_KEY_ID }}
        run: bash scripts/sign-release.sh
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/kixkan-browser_*.deb
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            artifacts/kixkan-browser_*.deb \
            artifacts/kixkan-browser_*.deb.sha256 \
            artifacts/kixkan-browser_*.deb.sha512 \
            --draft --title "KixKan Browser ${{ inputs.version }}" --notes-file RELEASE_NOTES.md
