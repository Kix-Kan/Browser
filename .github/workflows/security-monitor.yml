name: Monitor Firefox ESR security updates

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-esr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Compare approved ESR pin with Mozilla
        shell: bash
        run: |
          set +e
          result="$(python3 scripts/check-upstream.py)"
          status=$?
          set -e
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          if [[ "$status" == 10 ]]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
      - name: Open or update urgent tracking issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          title="Security: Firefox ESR foundation update available"
          if ! gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --label security --body "Mozilla reports a newer ESR than the approved KixKan pin: \`$RESULT\`. Update the pin, verify source signature/checksum, build, test, and release independently of KixKan OS."
          fi

